name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build XControl.sln -c Release
      - name: Test (no driver needed)
        run: dotnet test tests/XControl.Tests -c Release --no-build
      - name: Package (zip + single-file exe)
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: XControl-win-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
